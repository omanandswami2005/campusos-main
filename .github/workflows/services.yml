name: services

on:
  push:
    paths:
      - 'services/**'
      - 'packages/**'
      - 'turbo.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'services/**'
      - 'packages/**'
      - 'turbo.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'

jobs:
  canteen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --ignore-scripts
      - name: Generate Prisma
        run: pnpm db:generate
      - name: Typecheck canteen
        run: pnpm turbo run typecheck --filter=@campus-os/service-canteen
      - name: Build canteen
        run: pnpm turbo run build --filter=@campus-os/service-canteen
