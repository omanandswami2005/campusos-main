# Campus OS Docker Compose Configuration
# For local development and testing
# =============================================================================

name: campus-os

services:
  # ===========================================================================
  # Auth Service
  # ===========================================================================
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - '4300:4300'
    environment:
      - NODE_ENV=development
      - AUTH_PORT=4300
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-campus-os-dev-secret}
      - JWT_ISSUER=${JWT_ISSUER:-campus-os-auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-campus-os-services}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4300/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - campus-os-network

  # ===========================================================================
  # Canteen Service
  # ===========================================================================
  canteen:
    build:
      context: .
      dockerfile: services/canteen/Dockerfile
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - CANTEEN_PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-campus-os-dev-secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - campus-os-network

  # ===========================================================================
  # Printing Service
  # ===========================================================================
  printing:
    build:
      context: .
      dockerfile: services/printing/Dockerfile
    ports:
      - '4100:4100'
    environment:
      - NODE_ENV=development
      - PRINTING_PORT=4100
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-campus-os-dev-secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - campus-os-network

  # ===========================================================================
  # Events Service
  # ===========================================================================
  events:
    build:
      context: .
      dockerfile: services/events/Dockerfile
    ports:
      - '4200:4200'
    environment:
      - NODE_ENV=development
      - EVENTS_PORT=4200
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-campus-os-dev-secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - campus-os-network

  # ===========================================================================
  # Web Application (Next.js)
  # ===========================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_AUTH_URL=http://localhost:4300
      - NEXT_PUBLIC_CANTEEN_URL=http://localhost:4000
      - NEXT_PUBLIC_PRINTING_URL=http://localhost:4100
      - NEXT_PUBLIC_EVENTS_URL=http://localhost:4200
    depends_on:
      - auth
      - canteen
      - printing
      - events
    restart: unless-stopped
    networks:
      - campus-os-network

networks:
  campus-os-network:
    driver: bridge

